<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Musicprox</title>
    <meta name="description" content="Guess the secret artist by narrowing down their total Spotify streams. A new puzzle every day." />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <button class="icon-btn" id="btn-help" aria-label="How to play" title="How to play">?</button>
        <h1 class="brand" id="brand">Musicprox</h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-mode" aria-label="Switch between daily and random puzzle" title="Random puzzle">🎲</button>
          <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">📊</button>
        </div>
      </div>
      <nav class="switcher" id="switcher" aria-label="Games"></nav>
    </header>

    <main class="app" id="app">
      <section class="panel loading" id="loading">Loading…</section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="dlg-help" class="dialog">
      <form method="dialog" class="dialog-inner">
        <header class="dialog-head">
          <h2>How to play</h2>
          <button class="icon-btn" value="close" aria-label="Close">✕</button>
        </header>
        <div id="help-body"></div>
      </form>
    </dialog>

    <dialog id="dlg-stats" class="dialog">
      <form method="dialog" class="dialog-inner">
        <header class="dialog-head">
          <h2>Statistics</h2>
          <button class="icon-btn" value="close" aria-label="Close">✕</button>
        </header>
        <div id="stats-body"></div>
      </form>
    </dialog>

    <script type="module">
      import { start } from '../src/app.js';
      import config from '../src/games/music.js';
      start(config);
    </script>
  </body>
</html>
